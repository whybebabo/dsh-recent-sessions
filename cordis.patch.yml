# @whybebabo/dsh-recent-sessions bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published package: when the
# plugin is installed through the official CLI —
#
#   dsh plugin --profile <profile> add @whybebabo/dsh-recent-sessions
#
# — the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `@whybebabo/dsh-recent-sessions` to the bundle stack.
# The profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line. No profile file edits
# needed — one command installs and mounts.
#
# This plugin is client-only: the host half (lib/index.js) has an empty apply.
# It exists so the package is an *enabled Loader entry*, which is what makes the
# browser half discoverable (client bundles are served for enabled entries only).
- insert:
    - id: recent-sessions
      name: '@whybebabo/dsh-recent-sessions'
